        description: The field to sort results by. Default is `name`.
        name: sort_by
        in: query
      - enum:
        - asc
        - desc
        type: string
        description: The direction to sort results. Default is `asc`.
        name: sort_dir
        in: query
      - enum:
        - approve
        - tolerate
        - nudge
        - block
