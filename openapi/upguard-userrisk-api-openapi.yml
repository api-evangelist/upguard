        description: The security rating of the vendor (0-950).
        type: integer
        format: int64
        example: 900
      vendor_security_rating_trend:
        description: The change in the vendor's security rating in the last 30 days.
        type: integer
        format: int64
        example: 100
      vendor_using_ai:
        description: Indicates whether the vendor is known to use AI.
        type: boolean
        example: true
