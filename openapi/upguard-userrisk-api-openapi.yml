definitions:
  App:
    type: object
    required:
    - name
    - is_shadow_ai
    - usage_policy
    - num_current_users
    - first_detected
    - sources
    - metadata
    properties:
      category:
        description: The category of the application.
        type: string
        example: Team Communication
      description:
        description: A description of the application.
        type: string
        example: Microsoft Teams is a cloud-based communication and collaboration service that combines chat, video conferencing, and meeting recording into a single experience.
      domain:
        description: The domain associated with the application.
        type: string
        example: teams.microsoft.com
      exposure_level:
        description: The risk level associated with the application or permission.
        type: string
        format: string
        enum:
        - basic
        - elevated
        example: elevated
      first_detected:
        description: The date and time the application was first detected.
        type: string
        format: date-time
        example: '2025-12-01T00:00:00Z'
      is_shadow_ai:
        description: Indicates whether the application is considered Shadow AI.
        type: boolean
        example: false
      metadata:
        $ref: '#/definitions/AppMetadata'
      name:
        description: The name of the application.
        type: string
        example: Microsoft Teams
      num_current_users:
        description: The number of users currently using the application.
        type: integer
        format: int64
        example: 100
      sources:
        description: The sources from which the application was detected.
        type: array
        enum:
        - browser
        - google
        - microsoft
        items:
          type: string
          format: string
        example:
        - browser
        - microsoft
      summary:
        description: A brief summary of the application.
        type: string
        example: Microsoft Teams is a cloud-based communication and collaboration service that combines chat, video conferencing, and meeting recording into a single experience.
      usage_policy:
        $ref: '#/definitions/UsagePolicy'
      vendor_id:
        description: The unique identifier of the vendor.
        type: integer
        format: int64
        example: 1234567890
      vendor_monitored:
        description: Indicates whether the vendor is being monitored.
        type: boolean
        example: true
      vendor_name:
        description: The name of the vendor associated with the application.
        type: string
        example: Microsoft
