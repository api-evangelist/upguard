        - microsoft
        type: array
        items:
          type: string
          format: string
        collectionFormat: multi
        description: Filter applications by source.
        name: sources
        in: query
      - type: boolean
        description: Filter applications by Shadow AI status.
        name: shadow_ai
        in: query
      - type: boolean
        description: Filter applications by AI usage.
        name: vendor_using_ai
        in: query
      - type: boolean
