        example: Approved
  GetQuestionnaireAnswersResponsePayload:
    type: object
    properties:
      questions:
        description: The list of questions with their answers
        type: array
        items:
          $ref: '#/definitions/Question'
  GetVendorAdditionalEvidencesResponsePayload:
    type: object
    properties:
      additional_evidence:
        description: The additional evidence uploaded for this vendor.
        type: array
        items:
          $ref: '#/definitions/additional_evidences_list'
      next_page_token:
        description: 'The token to be used to retrieve the next page of results.

          Will not be returned if there are no more results.'
        type: string
      total_results:
        description: The total number of vendors found.
        type: integer
        format: int64
  OnboardingRequestsListRespBody:
    description: OnboardingRequestsListRespBody is the response body for the onboarding requests list endpoint
    type: object
    properties:
      next_page_token:
        description: Token for the next page of results
        type: string
      onboarding_requests:
        description: The list of onboarding requests
        type: array
        items:
          $ref: '#/definitions/OnboardingRequestListItem'
      total_results:
        description: The total number of matching results
        type: integer
        format: int64
        example: 100
  GetRangesV1RespBody:
    type: object
    properties:
      next_page_token:
        description: 'The token to be used to retrieve the next page of results.

          Will not be returned if there are no more results.'
        type: string
      ranges:
        description: The list of ranges
        type: array
        items:
          $ref: '#/definitions/ApiRange'
      total_results:
        description: The total number of ranges found.
        type: integer
        format: int64
  SingleChoiceAnswer:
    description: SingleChoiceAnswer represents a single choice answer
    type: object
    properties:
      selected_option_id:
        description: The ID of the selected option
        type: string
        example: opt_yes
      selected_option_text:
        description: The text of the selected option
        type: string
        example: 'Yes'
  GetIPsV1RespBody:
    type: object
    properties:
      ips:
        description: The list of ips
        type: array
        items:
          $ref: '#/definitions/IP'
      next_page_token:
        description: 'The token to be used to retrieve the next page of results.

          Will not be returned if there are no more results.'
        type: string
      total_results:
        description: The total number of ips found.
        type: integer
        format: int64
  ChoiceOption:
    description: ChoiceOption represents a single option in a choice question
    type: object
    properties:
      checked:
        description: Whether this option is checked (for multiple choice questions)
        type: boolean
        example: true
      id:
        description: Unique identifier for the option
        type: string
        example: opt_yes
      selected:
        description: Whether this option is selected (for single choice questions)
        type: boolean
        example: true
      text:
        description: The text label for the option
        type: string
        example: 'Yes'
  GetQuestionnaireResponsePayload:
    type: object
    properties:
      answered_at:
        description: When the questionnaire was answered/returned
        type: string
        format: date-time
        example: '2024-03-20T15:30:00Z'
      answered_by:
        $ref: '#/definitions/QuestionnaireSender'
      due_date:
        description: The datetime that the questionnaire is due to be completed.
        type: string
        format: date-time
        example: '2024-04-20T00:00:00Z'
      id:
        description: The ID of the questionnaire
        type: integer
        format: int64
        example: 12345
      percent_completed:
        description: Percentage of questions answered (0-100)
        type: number
        format: double
        example: 85.5
      questionnaire_name:
        description: The name of the questionnaire
        type: string
        example: Security Assessment for Acme Corp
      questionnaire_type_id:
        description: The ID of the questionnaire type/template
        type: integer
        format: int64
        example: 42
      recipients:
        description: List of questionnaire recipients
        type: array
        items:
          $ref: '#/definitions/QuestionnaireRecipient'
      score:
        description: Risk score for the questionnaire out of 950 (if enabled and available)
        type: integer
        format: int64
        example: 750
      sent_at:
        description: Datetime when the questionnaire was sent
        type: string
        format: date-time
        example: '2024-03-15T10:00:00Z'
      sent_by:
        $ref: '#/definitions/QuestionnaireSender'
      status:
        description: The current status of the questionnaire
        type: string
        enum:
        - sent
        - opened
        - returned
        - inreview
        - complete
        - cancelled
        - published
        example: complete
      type_name:
        description: The name of the questionnaire type
        type: string
        example: ISO 27001
  questionnaire:
    type: object
    properties:
      archived:
        description: Flag indicating whether the questionnaire has been archived
        type: boolean
        example: true
      due_date:
        description: 'The datetime that the questionnaire is due to be completed.

          This field will be null if no due date has been set.'
        type: string
        format: date-time
        example: '2022-04-20T00:00:00Z'
      id:
        description: The id of the questionnaire.
        type: integer
        format: int64
        example: 1
      in_remediation:
        description: Flag indicating whether there are risks under remediation in this questionnaire
        type: boolean
        example: false
      name:
        description: The name of the questionnaire.
        type: string
        example: iso27001
      returned_at:
        description: 'The datetime that the questionnaire was returned by the vendor.

          This field will be null if the questionnaire has not been returned.'
        type: string
        format: date-time
        example: '2022-03-20T23:23:37.228539Z'
      sent_at:
        description: The datetime that the questionnaire was sent.
        type: string
        format: date-time
        example: '2022-03-20T21:42:53.821938Z'
      status:
        description: The current status of the questionnaire.
        type: string
        enum:
        - sent
        - opened
        - returned
        - inreview
        - complete
        - cancelled
        - published
        example: complete
  QuestionnaireComment:
    description: QuestionnaireComment represents a comment on a questionnaire
    type: object
    properties:
      comment_id:
        description: The ID of the comment
        type: integer
        format: int64
        example: 12345
      created_at:
        description: When the comment was created
        type: string
        example: '2024-03-15T10:30:00Z'
      created_by_email:
        description: Email of the person who created the comment
        type: string
        example: auditor@yourcompany.com
      created_by_name:
        description: Name of the person who created the comment
        type: string
        example: Jane Doe
      is_internal:
        description: Whether this is an internal/private comment (only visible to your organization)
        type: boolean
        example: false
      parent_id:
        description: Parent comment ID (for replies, null if top-level comment)
        type: integer
        format: int64
        example: 12344
      question_id:
        description: The question ID this comment is for (null if top-level)
        type: string
        example: q_security_policy
      replies:
        description: Nested replies to this comment
        type: array
        items:
          $ref: '#/definitions/QuestionnaireComment'
      text:
        description: The comment text
        type: string
        example: Please provide more details about your backup procedures
      updated_at:
        description: When the comment was last updated
        type: string
        example: '2024-03-15T10:30:00Z'
  shared_questionnaire:
    type: object
    properties:
      id:
        description: The id of the questionnaire.
        type: integer
        format: int64
        example: 1
      in_remediation:
        description: Flag indicating whether there are risks under remediation in this questionnaire
        type: boolean
        example: false
      included_in_risk_profile:
        description: Flag indicating whether the questionnaire is included in the risk profile and vendor scoring
        type: boolean
        example: false
      name:
        description: The name of the questionnaire.
        type: string
        example: iso27001
      published_at:
        description: The datetime that the questionnaire was published.
        type: string
        format: date-time
        example: '2022-03-20T21:42:53.821938Z'
  FileUploadAnswer:
    description: FileUploadAnswer represents a file upload answer
    type: object
    properties:
      filename:
        description: The filename of the uploaded file
        type: string
        example: security_policy.pdf
  UpdateVendorAttributesV1RequestBody:
    type: object
    required:
    - vendor_primary_hostname
    properties:
      attributes:
        description: 'The attributes to assign to the vendor. If you want to reset an attribute pass null as value.

          For multi select attributes use a comma separated list of values. If any of the values contains

          a comma you can escape it with \,'
        type: object
        additionalProperties:
          type: string
        example:
          business owner: John Smith
          contract end date: null
          cost centre: '1234'
      vendor_primary_hostname:
        description: The primary hostname of the vendor to update attribute for.
        type: string
  IPSource:
    type: string
  VendorsResponsePayloadBody:
    type: object
    properties:
      next_page_token:
        description: 'The token to be used to retrieve the next page of results.

          Will not be returned if there are no more results.'
        type: string
      total_results:
        description: The total number of vendors found.
        type: integer
        format: int64
      vendors:
        description: The list of vendors found
        type: array
        items:
          $ref: '#/definitions/monitoredVendor'
  GetQuestionnaireCommentsResponsePayload:
    type: object
    properties:
      comments:
        description: 'Comments grouped by question ID (or "top_level" for comments not associated with a question)

          Each group contains comments sorted in descending order (oldest first)

          Each comment may have nested replies'
        type: object
        additionalProperties:
          type: array
          items:
            $ref: '#/definitions/QuestionnaireComment'
        example: '{"top_level": [...], "q_security_policy": [...]}'
  monitoredVendor:
    description: A monitored vendor
    type: object
    properties:
      assessmentStatus:
        description: Assessment status for the vendor. Possible values are Published, In progress, Not assessed. The field will be omitted for non monitored vendors.
        type: string
      attributes:
        description: The attributes applied to the vendor. If no attributes are applied this field will be omitted
        type: object
        additionalProperties:
          type: string
      automatedScore:
        description: The current automated score of the vendor without questionnaire. Omitted if no current scanning score.
        type: integer
        format: int64
      category_scores:
        $ref: '#/definitions/CategoryScores'
      id:
        description: 'The id of the vendor.

          Its possible for a hostname to change which vendor it belongs to for a number of reasons (eg. Company''s legal entity changes, improved data quality, etc...).

          For this reason, do not assume a hostname will always return the same vendor id.'
        type: integer
        format: int64
      labels:
        description: Labels that the vendor is currently associated with.
        type: array
        items:
          type: string
      lastAssessed:
        description: Date of the last assessment for the vendor. The field will be omitted if no published assessment is present.
        type: string
        format: date-time
      monitored:
        description: Indicates whether the vendor is monitored or not.
        type: boolean
      name:
        description: The name of the vendor
        type: string
      overallScore:
        description: The current score of the vendor including automated and questionnaire. Omitted if no current overall score.
        type: integer
        format: int64
      primary_hostname:
        description: The primary hostname of the vendor
        type: string
      questionnaireScore:
        description: The current questionnaire score of the vendor. Omitted if no current questionnaire score.
        type: integer
        format: int64
      risks:
        description: 'Optional list of risks for the vendor. Note that this is a summary list of risks and does not take into account risk waivers.

          To have a precise view of a vendor risks use the /risks/vendors endpoint.'
        type: array
        items:
          $ref: '#/definitions/VendorsRisk'
      score:
        description: 'NOTE: deprecated (use OverallScore). The current score of the vendor. A -1 value represents no current score for the vendor.'
        type: integer
        format: int64
      tier:
        description: Tier currently assigned to the vendor. Omitted if no tier is assigned to the vendor.
        type: integer
        format: int64
  fourthPartyWatchedVendor:
    type: object
    title: A watched vendor associated with a fourth party.
    properties:
      id:
        description: The id of the watched vendor.
        type: integer
        format: int64
      labels:
        description: The labels applied to the watched vendor.
        type: array
        items:
          type: string
      name:
        description: The name of the watched vendor.
        type: string
      score:
        description: The current score of the watched vendor. A -1 value represents no current score.
        type: integer
        format: int64
      tier:
        description: The tier of the watched vendor.
        type: integer
        format: int64
  additional_evidences_list:
    description: A vendor additional evidences list
    type: object
    properties:
      commentary:
        description: The commentary supplied to describe the context and relevance of the evidence
        type: string
      document_type:
        description: The evidence document type
        type: string
      file_name:
        description: The file name of the latest uploaded document (version) for this evidence
        type: string
      id:
        description: The additional evidence ID.
        type: integer
        format: int64
      name:
        description: The name given to the additional evidence
        type: string
      uploaded_at:
        description: When the latest document for this evidence was uploaded.
        type: string
        format: date-time
  vendor:
    description: A vendor
    type: object
    properties:
      assessment_status:
        description: Assessment status for the vendor. Possible values are Published, In progress, Not assessed. The field will be omitted for non monitored vendors.
        type: string
      attributes:
        description: The attributes applied to the vendor. If no attributes are applied this field will be omitted
        type: object
        additionalProperties:
          type: string
      automatedScore:
        description: The automated score of the vendor without questionnaire. Omitted if no current scanning score.
        type: integer
        format: int64
      categoryScores:
        $ref: '#/definitions/CategoryScores'
      category_risk_counts:
        $ref: '#/definitions/CategoryRiskCounts'
      domain_count_active:
        description: The total number of active domains for this vendor.
        type: integer
        format: int64
      domain_count_inactive:
        description: The total number of inactive domains for this vendor.
        type: integer
        format: int64
      domain_count_total:
        description: The total number of domains for this vendor.
        type: integer
        format: int64
      first_monitored:
        description: The date that this vendor was monitored by your organization.
        type: string
      id:
        description: 'The id of the vendor.

          Its possible for a hostname to change which vendor it belongs to for a number of reasons (eg. Company''s legal entity changes, improved data quality, etc...).

          For this reason, do not assume a hostname will always return the same vendor id.'
        type: integer
        format: int64
      industry_average_score:
        description: The average overall score for the industry this vendor falls into.
        type: integer
        format: int64
      industry_group:
        description: The industry group this vendor falls into.
        type: string
      industry_sector:
        description: 'The industry sector this vendor falls into.

          Industry sectors contain multiple industry groups.'
        type: string
      labels:
        description: The labels applied to the vendor. If no labels are present this field will be omitted.
        type: array
        items:
          type: string
      last_assessed:
        description: Date of the last assessment for the vendor. The field will be omitted if no published assessment is present.
        type: string
        format: date-time
      name:
        description: The name of the vendor
        type: string
      note:
        description: The note applied to the vendor. If no note is applied this field will be omitted
        type: string
      overallScore:
        description: The current score of the vendor including automated and questionnaire. Omitted if no current overall score.
        type: integer
        format: int64
      overall_risk_counts:
        $ref: '#/definitions/RiskCounts'
      portfolios:
        description: The portfolios applied to the vendor. If no portfolios are applied this field will be omitted
        type: array
        items:
          type: string
      primary_hostname:
        description: The primary hostname of the vendor
        type: string
      questionnaireScore:
        description: The current questionnaire score of the vendor. Omitted if no current questionnaire score.
        type: integer
        format: int64
      reassessment_date:
        description: Optional date of the next scheduled assessment for the vendor.
        type: string
        format: date-time
      score:
        description: 'NOTE: deprecated (use AutomatedScore). The current automated score of the vendor. A -1 value represents no current score for the vendor.'
        type: integer
        format: int64
      scores_by_epoch:
        description: 'Overall scores and category scores by epoch.

          Broken down into now, 1 month ago, 3 months ago, and 1 year ago.'
        type: array
        items:
          $ref: '#/definitions/ScoreByEpoch'
      tier:
        description: The tier applied to the vendor. If no tier is applied to the vendor this field will be omitted
        type: integer
        format: int64
      vendor_metadata:
        $ref: '#/definitions/VendorMetadata'
  questionnaireRecipient:
    description: Model for a questionnaire recipient
    type: object
    required:
    - recipient_email
    properties:
      recipient_email:
        description: The email address of the questionnaire recipient (will be invited to the platform if not already a member).
        type: string
        example: security@upguard.com
      recipient_first_name:
        description: The first name of the questionnaire recipient (used for new recipients only).
        type: string
        example: John
      recipient_last_name:
        description: The last name of the questionnaire recipient (used for new recipients only).
        type: string
        example: Smith
      recipient_title:
        description: The title of the questionnaire recipient (used for new recipients only).
        type: string
        example: CSO
  questionnaireSent:
    description: Questionnaire ID
    type: object
    properties:
      questionnaire_id:
        description: The id of the questionnaire that was sent
        type: integer
        format: int64
  RiskAnswer:
    description: RiskAnswer represents a risk answer
    type: object
    properties:
      compensating_control:
        description: Compensating controls that have been implemented to address this risk
        type: string
        example: We use encryption at rest and in transit, with strict access controls
      severity:
        description: The severity level of the risk
        type: string
        enum:
        - info
        - low
        - medium
        - high
        - critical
        example: high
  relationship_questionnaire_sent:
    description: Relationship Questionnaire ID
    type: object
    properties:
      questionnaire_id:
        description: The id of the questionnaire that was sent
        type: integer
        format: int64
  ApiRange:
    type: object
    properties:
      as_name:
        description: The name of the AS the range belongs to. If no AS is available for a range this field will be omitted.
        type: string
      asn:
        description: The ASN the range belongs to. If no ASN is available for a range this field will be omitted.
        type: integer
        format: int64
      country:
        description: The country the range belongs to. If no country is available for a range this field will be omitted.
        type: string
      end:
        description: The range end.
        type: string
      labels:
        description: The labels associated with the range.
        type: array
        items:
          type: string
      num_ips:
        description: The number of IPs in this range
        type: integer
        format: int64
      owner:
        description: The owner of the range.
        type: string
      sources:
        description: The sources of the range.
        type: array
        items:
          $ref: '#/definitions/IPSource'
      start:
        description: The range start.
        type: string
  GetIpDetailsV1RespBody:
    type: object
    properties:
      as_name:
        description: The name of the AS the IP belongs to. If no AS is available for an IP this field will be omitted.
        type: string
      asn:
        description: The ASN the IP belongs to. If no ASN is available for an IP this field will be omitted.
        type: integer
        format: int64
      automated_score:
        description: The score of the ip. If the ip is inactive or hasn't been scanned yet this field will be absent
        type: integer
        format: int64
      check_results:
        description: The results of the IP scan. This field will be omitted if the IP has not been scanned or no results are available, e.g. DNS source IP.
        type: array
        items:
          $ref: '#/definitions/CheckResult'
      country:
        description: The country the IP belongs to. If no country is available for an IP this field will be omitted.
        type: string
      domains:
        description: The list of domains associated with this IP. This field will be omitted if no domains are associated with the IP.
        type: array
        items:
          $ref: '#/definitions/DomainScore'
      ip:
        description: The IP.
        type: string
      labels:
        description: The labels associated with the IP.
        type: array
        items:
          type: string
      owner:
        description: The owner of the IP.
        type: string
      services:
        description: The list of discovered services IP. If no services were detected for the IP this field will be omitted.
        type: array
        items:
          type: string
      sources:
        description: The sources of the IP.
        type: array
        items:
          $ref: '#/definitions/IPSource'
      waived_check_results:
        description: The waived risks for this IP. This field will be omitted if no waived risks are present.
        type: array
        items:
          $ref: '#/definitions/CheckResult'
  Severity:
    type: integer
    format: int64
  GetDomainsV1RespBody:
    type: object
    properties:
      domains:
        description: The list of domains
        type: array
        items:
          $ref: '#/definitions/Domain'
      next_page_token:
        description: 'The token to be used to retrieve the next page of results.

          Will not be returned if there are no more results.'
        type: string
      total_results:
        description: The total number of domains found.
        type: integer
        format: int64
  CategoryRiskCounts:
    description: The count of risks, broken down by category, then by severity
    type: object
    properties:
      attack_surface:
        $ref: '#/definitions/RiskCounts'
      brand_protection:
        $ref: '#/definitions/RiskCounts'
      brand_reputation:
        $ref: '#/definitions/RiskCounts'
      data_leakage:
        $ref: '#/definitions/RiskCounts'
      dns:
        $ref: '#/definitions/RiskCounts'
      email_security:
        $ref: '#/definitions/RiskCounts'
      encryption:
        $ref: '#/definitions/RiskCounts'
      ip_domain_reputation:
        $ref: '#/definitions/RiskCounts'
      network_security:
        $ref: '#/definitions/RiskCounts'
      operational_risk:
        $ref: '#/definitions/RiskCounts'
      phishing:
        $ref: '#/definitions/RiskCounts'
      questionnaires:
        $ref: '#/definitions/RiskCounts'
      vulnerability_management:
        $ref: '#/definitions/RiskCounts'
      website_security:
        $ref: '#/definitions/RiskCounts'
  VendorContactList:
    type: object
    properties:
      contacts:
        type: array
        items:
          $ref: '#/definitions/VendorContact'
      next_page_token:
        type: string
  GetVendorQuestionnaireAttachmentsResponsePayload:
    type: object
    properties:
      attachments:
        description: The list of questionnaires sent to this vendor
        type: array
        items:
          $ref: '#/definitions/VendorQuestionnaireAttachment'
      next_page_token:
        description: 'The token to be used to retrieve the next page of results.

          Will not be returned if there are no more results.'
        type: string
      total_results:
        description: The total number of attachments found for the questionnaire.
        type: integer
        format: int64
  GetDomainDetailsV1RespBody:
    type: object
    properties:
      a_records:
        description: The list of A records associated with the domain. This field will be omitted if no A records were associated with the domain
        type: array
        items:
          type: string
      automated_score:
        description: The score for the domain. If the domain has not been scanned or no score is present this field will be omitted.
        type: integer
        format: int64
      check_results:
        description: The results of the domain scan. This field will be omitted if the domain has not been scanned or no results are available.
        type: array
        items:
          $ref: '#/definitions/CheckResult'
      hostname:
        description: The hostname of the domain
        type: string
      labels:
        description: The labels associated with the domain. This field will be omitted if no labels are present.
        type: array
        items:
          type: string
      scanned_at:
        description: The time the domain was scanned in RFC3339 format
        type: string
        format: date-time
      waived_check_results:
        description: The waived risks for this domain. This field will be omitted if no waived risks are present.
        type: array
        items:
          $ref: '#/definitions/CheckResult'
securityDefinitions:
  API key in header:
    type: apiKey
    in: header
    name: Authorization
