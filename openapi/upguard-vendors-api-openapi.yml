definitions:
  Category:
    description: Category values cannot be changed after first use, as they're referenced in storage.
    type: string
    title: Category values represent risk categories.
  QuestionnaireSender:
    description: QuestionnaireSender represents the sender of a questionnaire
    type: object
    properties:
      email:
        description: Email address of the sender
        type: string
        example: auditor@yourcompany.com
      name:
        description: Full name of the sender
        type: string
        example: Jane Doe
  GetVendorAttachmentResponsePayload:
    type: object
    properties:
      File:
        description: The list of binary attachments sent with the questionnaire response
        type: array
        items:
          $ref: '#/definitions/File'
  TextAnswer:
    description: TextAnswer represents a text answer
    type: object
    properties:
      value:
        description: The text value of the answer
