aid: upguard
name: UpGuard
description: >-
  UpGuard is a cybersecurity platform that helps organizations manage and reduce
  their cyber risk. Its products cover third-party vendor risk management
  (Vendor Risk), attack surface management and external threat monitoring
  (Breach Risk), and AI-powered security questionnaire automation and trust
  center tooling (Trust Exchange). The UpGuard CyberRisk API exposes the
  platform programmatically — vendors and security ratings, risks and
  vulnerabilities, domains and IPs, data leak disclosures, identity breaches,
  typosquatting, questionnaires, subsidiaries, labels, notifications, and
  webhooks — authenticated with an API key from CyberRisk account settings.
